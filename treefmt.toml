# Treefmt configuration
# See https://github.com/numtide/treefmt

[formatter.dprint]
command = "dprint"
options = ["fmt"]
includes = ["*.ts", "*.tsx", "*.js", "*.jsx", "*.json", "*.md", "*.toml", "*.yaml", "*.yml"]
excludes = [".claude/**", "agents/.apm/**", ".github/**"]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]
