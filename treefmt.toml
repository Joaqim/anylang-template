# Treefmt configuration
# See https://github.com/numtide/treefmt

[formatter.dprint]
command = "dprint"
options = ["fmt"]
includes = ["*.ts", "*.tsx", "*.js", "*.jsx", "*.json", "*.md", "*.toml", "*.yaml", "*.yml"]
excludes = [".claude/**"]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.typos]
command = "typos"
includes = ["*"]
excludes = ["pnpm-lock.yaml", "package-lock.json", "yarn.lock", "*.lock", "node_modules"]
